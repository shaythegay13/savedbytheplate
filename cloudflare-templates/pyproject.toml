[project]
name = "garden-api-worker"
version = "2.0.0"
description = "Cloudflare Worker for Smart Backyard garden planning with Groq"
requires-python = ">=3.11"
authors = [
    {name = "Smart Backyard Tech", email = "tech@smartbackyard.ai"}
]

dependencies = [
    "fastapi>=0.109.0",
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
